name: Feature request
description: Suggest an idea for Pinpoint
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today, or what's painful about the current workflow?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: Describe the feature as concretely as you can
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or think of?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or examples of how other tools handle this
